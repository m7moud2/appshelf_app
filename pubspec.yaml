name: appshelf_app
description: رف التطبيقات — عميل موبايل لمتجر AppShelf المستقل
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ^3.5.3

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.8
  provider: ^6.1.2
  http: ^1.2.2
  shared_preferences: ^2.3.3
  google_fonts: ^6.2.1
  cached_network_image: ^3.4.1
  url_launcher: ^6.3.1
  intl: ^0.19.0
  google_sign_in: ^6.2.2
  sign_in_with_apple: ^6.1.3
  share_plus: ^10.1.4
  flutter_local_notifications: ^18.0.1
  flutter_svg: ^2.0.17

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  flutter_launcher_icons: ^0.14.3

flutter_launcher_icons:
  android: true
  ios: true
  macos:
    generate: true
  web:
    generate: true
    background_color: "#234F4A"
    theme_color: "#2F6A63"
  image_path: assets/brand/app_icon.png
  adaptive_icon_background: "#234F4A"
  adaptive_icon_foreground: assets/brand/app_icon.png

flutter:
  uses-material-design: true
  assets:
    - assets/brand/appshelf-mark.svg
    - assets/brand/appshelf-mark.png
